<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>youtube playlist video search - search with invidious</title>
    <link rel="stylesheet" href="/invidious/invidious-style.css">
    <script src="/small-functions.js"></script>
    <link rel="icon" type="image/x-icon" href="/icon.ico">
</head>
<body>
    <div class="container">
        <a href="/" tabindex="6"><b>go back</b></a>
        <h1>search with invidious</h1>
        <div class="instance-selector">
            <label for="instanceSelect">Select an Invidious Instance:</label>
            <select id="instanceSelect">
                <option value="yewtu.be">yewtu.be</option>
                <option value="vid.puffyan.us">vid.puffyan.us</option>
                <option value="invidious.io.lol">invidious.io.lol</option>
                <option value="inv.nadeko.net">inv.nadeko.net</option>
                <option value="invidious.projectsegfau.lt">invidious.projectsegfau.lt</option>
            </select>
            <label for="instanceInput">Or enter manually (e.g., invidious.xyz):</label>
            <input type="text" id="instanceInput" placeholder="invidious.xyz">
        </div>

        <form id="searchForm">
            <label for="playlistUrl">YouTube Playlist Link:</label>
            <input type="text" id="playlistUrl" placeholder="Paste playlist URL (e.g., https://www.youtube.com/playlist?list=...)" required autofocus tabindex="1">
            <label for="searchTerm">Search Term:</label>
            <input type="text" id="searchTerm" tabindex="2">
            
            <div class="checkbox-group">
                <input type="checkbox" id="wholeWordMatch" tabindex="4">
                <label for="wholeWordMatch">Match whole word</label>
            </div>

            <div class="search-mode-group">
              <p style="font-size: 22px;">search by:</p>
              <label><input type="radio" name="searchMode" value="title" checked tabindex="4"> video title (default)</label>
              <label><input type="radio" name="searchMode" value="channel" tabindex="7"> channel name</label>
            </div>
            <button type="submit" tabindex="5">Search</button>
        </form>
        
        <p id="statusMessage"></p>
        <ul id="results" class="video-list"></ul>
    </div>
    
    <script src="/invidious/invidiousFetchPlaylist.js" type="module"></script>
</body>

</html>
