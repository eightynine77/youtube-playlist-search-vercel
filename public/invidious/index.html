<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Playlist Video Search</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="icon" type="image/x-icon" href="/icon.ico">
</head>
<body>
    <div class="container">
    <h1>youTube playlist video search - search with invidious</h1>
        <form id="searchForm">
            <label for="playlistUrl">YouTube Playlist Link:</label>
            <input type="text" id="playlistUrl" placeholder="Paste playlist URL (e.g., https://www.youtube.com/playlist?list=...)" required>
            <label for="searchTerm">Search Term:</label>
            <input type="text" id="searchTerm" placeholder="Search videos by title">
            <div class="checkbox-group">
                <input type="checkbox" id="wholeWordMatch">
                <label for="wholeWordMatch">Match whole word</label>
            </div>
            <div class="search-mode-group">
              <p style="font-size: 22px;">Search video description</p>
              <label><input type="radio" name="searchMode" value="title" checked> Search video title only (default)</label>
              <label><input type="radio" name="searchMode" value="both"> search video description and title</label>
              <label><input type="radio" name="searchMode" value="description"> Search video description only</label>
              <label><input type="radio" name="searchMode" value="channel"> Search by channel name only</label>
          </div>
            <button type="submit">Search</button>
        </form>
        
        <p id="statusMessage"></p>
        <ul id="results" class="video-list"></ul>
  </div>
</body>
</html>
