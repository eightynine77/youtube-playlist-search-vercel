<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>youtube playlist video search</title>
  <link rel="stylesheet" href="style.css">
  <script src="small-functions.js"></script>
  <link rel="icon" type="image/x-icon" href="icon.ico">
</head>
<body>
  <div class="container">
    <a href="/invidious" tabindex="9"><b>search with invidious</b></a>
    <h1>youtube playlist video search</h1>
        <form id="searchForm">
            <label for="playlistUrl">YouTube Playlist Link:</label>
            <input type="text" id="playlistUrl" placeholder="Paste playlist URL (e.g., https://www.youtube.com/playlist?list=...)" required autofocus tabindex="1">
            <label for="searchTerm">Search Term:</label>
            <input type="text" id="searchTerm" placeholder="Search videos by title" tabindex="2">
            <div class="checkbox-group">
                <input type="checkbox" id="wholeWordMatch" tabindex="3">
                <label for="wholeWordMatch">Match whole word</label>
            </div>
            <div class="search-mode-group">
              <p style="font-size: 22px;">Search video description</p>
              <label><input type="radio" name="searchMode" value="title" checked tabindex="4"> Search video title only (default)</label>
              <label><input type="radio" name="searchMode" value="both" tabindex="5"> search video description and title</label>
              <label><input type="radio" name="searchMode" value="description" tabindex="6"> Search video description only</label>
              <label><input type="radio" name="searchMode" value="channel" tabindex="7"> Search by channel name only</label>
          </div>
            <button type="submit" tabindex="8">Search</button>
        </form>
        
        <p id="statusMessage"></p>
        <ul id="results" class="video-list"></ul>
  </div>

  <script type="module" src="javascript.js"></script>
</body>

</html>
